<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bagFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#357061"/>
      <stop offset="1" stop-color="#2E5E4E"/>
    </linearGradient>
    <linearGradient id="bagSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26513F"/>
      <stop offset="1" stop-color="#214A3C"/>
    </linearGradient>
    <linearGradient id="tissue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2EBDD"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8C7AE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D8C7AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="100" cy="176" rx="56" ry="11" fill="url(#floor)"/>

  <!-- handles -->
  <path d="M76 60 C76 34 110 34 110 60" fill="none" stroke="#D99A4E" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M76 60 C76 36 110 36 110 60" fill="none" stroke="#E8C07D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M114 60 C114 36 146 36 146 60" fill="none" stroke="#C2843E" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M114 60 C114 38 146 38 146 60" fill="none" stroke="#D99A4E" stroke-width="2.2" stroke-linecap="round"/>

  <!-- bag body -->
  <path d="M62 62 H156 a8 8 0 0 1 8 8 L160 162 a10 10 0 0 1 -10 10 H68 a10 10 0 0 1 -10 -10 L54 70 a8 8 0 0 1 8 -8 Z" fill="url(#bagFront)"/>

  <!-- shaded right side panel for depth -->
  <path d="M132 62 H156 a8 8 0 0 1 8 8 L160 162 a10 10 0 0 1 -10 10 H134 Z" fill="url(#bagSide)"/>

  <!-- top rim / opening band -->
  <path d="M62 62 H156 a8 8 0 0 1 8 8 L163.5 76 H56.5 L54 70 a8 8 0 0 1 8 -8 Z" fill="#214A3C"/>

  <!-- gold accent band -->
  <rect x="56.5" y="92" width="107" height="9" fill="#D99A4E"/>
  <rect x="56.5" y="92" width="107" height="3" fill="#E8C07D"/>
  <path d="M132 92 H163.5 V101 H132 Z" fill="#C2843E"/>

  <!-- polka dots, lower panel -->
  <g fill="#E8C07D">
    <circle cx="74" cy="118" r="3.4"/>
    <circle cx="100" cy="126" r="3.4"/>
    <circle cx="126" cy="118" r="3.4"/>
    <circle cx="87" cy="142" r="3.4"/>
    <circle cx="113" cy="142" r="3.4"/>
    <circle cx="74" cy="158" r="3.4"/>
    <circle cx="100" cy="152" r="3.4"/>
    <circle cx="126" cy="158" r="3.4"/>
  </g>
  <!-- dots on shaded side, dimmed -->
  <g fill="#C2843E">
    <circle cx="143" cy="124" r="3.2"/>
    <circle cx="150" cy="148" r="3.2"/>
    <circle cx="140" cy="164" r="3.2"/>
  </g>

  <!-- soft front highlight stripe -->
  <path d="M64 78 L72 78 L67 166 L60 162 Z" fill="#FFFFFF" opacity="0.10"/>

  <!-- tissue paper puffing out -->
  <g>
    <path d="M70 64 C58 52 64 36 78 40 C76 28 96 24 100 38 C108 26 126 32 120 46 C134 40 142 56 128 64 Z" fill="url(#tissue)"/>
    <path d="M86 60 C80 50 88 42 94 48 C96 42 104 44 102 52 C110 48 112 58 104 60 Z" fill="#E8DECF" opacity="0.7"/>
    <path d="M78 40 C76 28 96 24 100 38" fill="none" stroke="#E8DECF" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <path d="M100 38 C108 26 126 32 120 46" fill="none" stroke="#E8DECF" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>