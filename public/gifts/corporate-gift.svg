<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EAD9"/>
      <stop offset="1" stop-color="#E8DECF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8DECF"/>
      <stop offset="1" stop-color="#D8C7AE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C07D"/>
      <stop offset="1" stop-color="#D99A4E"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8C7AE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D8C7AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="100" cy="166" rx="62" ry="12" fill="url(#floor)"/>

  <!-- box body -->
  <rect x="48" y="78" width="104" height="78" rx="7" fill="url(#body)"/>
  <!-- inner side shading -->
  <rect x="48" y="78" width="18" height="78" rx="7" fill="#D8C7AE" opacity="0.5"/>

  <!-- lid -->
  <rect x="42" y="62" width="116" height="30" rx="8" fill="url(#lid)"/>
  <!-- lid soft underside shadow on body -->
  <rect x="48" y="90" width="104" height="6" rx="3" fill="#C9B795" opacity="0.45"/>
  <!-- lid top highlight -->
  <rect x="50" y="66" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- thin gold ribbon vertical -->
  <rect x="95" y="62" width="10" height="94" fill="url(#gold)"/>
  <rect x="95" y="62" width="3" height="94" fill="#E8C07D" opacity="0.7"/>
  <!-- ribbon on lid slightly raised tone -->
  <rect x="95" y="62" width="10" height="30" fill="#E8C07D" opacity="0.25"/>

  <!-- minimal flat bow knot -->
  <path d="M100 60 C90 50 76 50 78 60 C80 68 94 64 100 60 Z" fill="url(#gold)"/>
  <path d="M100 60 C110 50 124 50 122 60 C120 68 106 64 100 60 Z" fill="url(#gold)"/>
  <path d="M100 60 C95 58 93 64 96 70 C99 64 99 62 100 60 Z" fill="#D99A4E"/>
  <path d="M100 60 C105 58 107 64 104 70 C101 64 101 62 100 60 Z" fill="#D99A4E"/>
  <circle cx="100" cy="61" r="4.5" fill="#E8C07D"/>
  <circle cx="98.5" cy="59.5" r="1.6" fill="#FFFFFF" opacity="0.7"/>

  <!-- gift tag hanging off ribbon -->
  <line x1="105" y1="74" x2="132" y2="98" stroke="#D99A4E" stroke-width="1.6"/>
  <g transform="rotate(20 138 108)">
    <rect x="120" y="96" width="36" height="24" rx="4" fill="#FBF7F0"/>
    <rect x="120" y="96" width="36" height="24" rx="4" fill="#FFFFFF" opacity="0.0" stroke="#D8C7AE" stroke-width="1"/>
    <circle cx="125" cy="102" r="2.4" fill="none" stroke="#D99A4E" stroke-width="1.4"/>
    <!-- tag detail lines -->
    <line x1="129" y1="106" x2="150" y2="106" stroke="#B23A48" stroke-width="2" stroke-linecap="round"/>
    <line x1="129" y1="111" x2="146" y2="111" stroke="#D8C7AE" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- subtle highlight on box face -->
  <rect x="54" y="100" width="3" height="48" rx="1.5" fill="#FFFFFF" opacity="0.35"/>
</svg>